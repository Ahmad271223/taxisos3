# Render Blueprint für TaxiOS (Next.js + Express + Socket.IO + Prisma/Postgres).
# Deploy: Render → New + → "Blueprint" → dieses Repo wählen.
# WICHTIG: Dies ist KEINE Static Site, sondern ein Node-Web-Service + Postgres.

databases:
  - name: taxisos-db
    # ACHTUNG – KOSTENPFLICHTIG. Vorher stand hier "free".
    # Eine kostenlose Render-Datenbank wird 30 Tage nach dem Anlegen GELOESCHT
    # (danach 14 Tage Gnadenfrist), ohne Backup. Fuer eine Plattform, die
    # Krankenfahrten disponiert und Rechnungen schreibt, ist das nicht tragbar.
    plan: starter
    databaseName: taxios
    user: taxios

services:
  - type: web
    name: taxisos3
    runtime: node
    # ACHTUNG – KOSTENPFLICHTIG. Vorher stand hier "free".
    # Ein kostenloser Webdienst wird nach 15 Minuten ohne Anfrage schlafen
    # gelegt und braucht rund eine Minute zum Hochfahren. In dieser Zeit steht
    # ALLES still: Fahrervermittlung, Fahrt-Erinnerungen, Flugverspaetungen,
    # automatische Abrechnung und die Live-Verbindungen der Fahrer. Nachts
    # bestellt selten jemand – genau deshalb wartet der erste Nachtgast eine
    # Minute auf eine kalte Instanz.
    plan: starter
    branch: main
    # devDependencies (tsx, prisma, build-tools) MÜSSEN installiert werden.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Migrationen vor dem Start anwenden, dann den Custom-Server (tsx server.ts) starten.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /
    envVars:
      # DB-Verbindung automatisch aus der oben definierten Postgres-Instanz.
      - key: DATABASE_URL
        fromDatabase:
          name: taxisos-db
          property: connectionString
      # Starkes Session-Secret automatisch generieren (sonst crasht Auth in PROD).
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      - key: ENABLE_SIMULATOR
        value: "0"
      - key: REQUIRE_PHONE_VERIFICATION
        value: "1"
      - key: SEARCH_MAX_MS
        value: "180000"
      # Render setzt genau EINEN Proxy davor. Das Rate-Limit zaehlt die
      # Client-IP deshalb vom rechten Ende der x-forwarded-for-Kette.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Begrenzt die Datenbankverbindungen je Instanz. Ohne das oeffnet Prisma
      # rund 17 Verbindungen – zwei Instanzen sprengen das Limit der
      # Starter-Datenbank.
      - key: DB_CONNECTION_LIMIT
        value: "10"
      - key: NEXT_PUBLIC_PLATFORM_PHONE
        value: "+49 511 1234567"
      # ── Optionale Keys: leer = Mock-Modus. Im Render-Dashboard setzen. ──
      # NEXT_PUBLIC_* werden zur BUILD-Zeit eingebacken -> vor dem Build setzen.
      - key: NEXT_PUBLIC_MAP_TILES_URL
        sync: false
      - key: NEXT_PUBLIC_MAP_TILES_ATTRIB
        sync: false
      - key: LOCATIONIQ_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Web-Push (Fahrer-Benachrichtigung). Mit `node scripts/gen-vapid.mjs`
      # erzeugen und im Dashboard setzen. Leer = Push deaktiviert.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Oeffentliche Adresse der Anwendung. Stripe springt nach der
      # Karteneingabe hierher zurueck, und alle SMS-Links zeigen darauf.
      - key: APP_BASE_URL
        sync: false
      # Erlaubte Herkunft fuer die Live-Verbindung. Leer = jede Website.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AVIATIONSTACK_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
