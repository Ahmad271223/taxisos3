# Render Blueprint fuer TaxiOS (Next.js + Express + Socket.IO + Prisma/Postgres).
#
# Deploy: Render -> New + -> "Blueprint" -> dieses Repo waehlen. Render legt
# daraus BEIDE Dienste an: den Web-Dienst und die Datenbank, Region Frankfurt.
#
# Zwei Regeln, die sich aus der Bauweise ergeben:
#   1. GENAU EINE Instanz des Web-Diensts. Die Vermittlung haelt ihren Zustand
#      im Prozessspeicher; zwei Instanzen wuessten nichts voneinander.
#   2. KEIN kostenloser/schlafender Plan. Alle Hintergrundlaeufe (Erinnerungen,
#      Zahlungsabschluss, Loeschlauf) laufen im Web-Prozess mit.

databases:
  - name: taxisos-db
    region: frankfurt
    # Bezahlplan: nur der hat taegliche Sicherungen und Wiederherstellungs-
    # punkte. Eine kostenlose Render-Datenbank wird nach 30 Tagen GELOESCHT.
    # basic-256mb (~6 $) reicht fuer den Start; basic-1gb (~19 $) hat Luft.
    plan: basic-1gb
    postgresMajorVersion: "16"
    databaseName: taxios
    user: taxios

services:
  - type: web
    name: taxisos3
    runtime: node
    region: frankfurt
    # standard = 2 GB RAM. Next.js im Produktionsmodus plus Vermittlung plus
    # bis zu ~60 offene Fahrer-Verbindungen brauchen mehr als die 512 MB des
    # Starter-Plans. Wer sparen will, kann mit "starter" beginnen und bei
    # Speicherwarnungen hochstufen.
    plan: standard
    numInstances: 1
    branch: main
    autoDeploy: true
    # devDependencies (tsx, prisma, Build-Werkzeuge) MUESSEN installiert werden.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Migrationen anwenden, Grunddaten (Super-Admin, wenn gesetzt) anlegen,
    # dann den Custom-Server starten.
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run start
    # Prueft auch die Datenbankverbindung - ein Prozess ohne Datenbank gilt
    # damit nicht mehr als gesund und wird neu gestartet.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # ---- Datenbank und Sitzungsgeheimnis: automatisch -------------------
      - key: DATABASE_URL
        fromDatabase:
          name: taxisos-db
          property: connectionString
      # Starkes Geheimnis, von Render erzeugt. Die Startsperre verlangt
      # mindestens 32 Zeichen und lehnt den bekannten Standardwert ab.
      - key: AUTH_SECRET
        generateValue: true
      # Begrenzt die Datenbankverbindungen je Instanz (Prisma oeffnet sonst ~17).
      - key: DB_CONNECTION_LIMIT
        value: "10"

      # ---- Generalprobe vor dem echten Start ---------------------------------
      # Die Startsperre verweigert im Echtbetrieb den Start ohne Live-Stripe
      # und Twilio. Fuer die Probe auf Render mit TEST-Schluesseln (kein
      # echtes Geld) hier "1" eintragen - der Server meldet dann bei jedem
      # Start laut, dass er im Probebetrieb laeuft. VOR dem echten Livegang
      # diese Variable LOESCHEN; nur AUTH_SECRET laesst sich nie umgehen.
      - key: ALLOW_TEST_MODE_IN_PRODUCTION
        sync: false

      # ---- Betrieb ---------------------------------------------------------
      # Render setzt genau EINEN Proxy davor: die Drosselung liest die
      # Client-IP deshalb vom rechten Ende der x-forwarded-for-Kette.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ENABLE_SIMULATOR
        value: "0"
      - key: REQUIRE_PHONE_VERIFICATION
        value: "1"
      - key: SEARCH_MAX_MS
        value: "180000"
      # SMS-Sparprofil: nur EINE Erinnerung je Vorbestellung (2 h vorher).
      # voll | sparsam | minimal - siehe memory/BETRIEBSHANDBUCH.md.
      - key: SMS_PROFIL
        value: sparsam
      - key: NEXT_PUBLIC_PLATFORM_PHONE
        value: "+49 511 1234567"

      # ---- Oeffentliche Adresse ---------------------------------------------
      # Beim ERSTEN Deploy leer lassen: der Server nimmt dann automatisch die
      # Render-Adresse (RENDER_EXTERNAL_URL). Sobald die eigene Domain
      # angebunden ist, hier eintragen, z. B. https://taxios.de - Stripe
      # springt nach der Karteneingabe hierher zurueck, alle SMS-Links zeigen
      # darauf, und nur diese Herkunft darf die Live-Verbindung nutzen.
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # ---- Alarmierung: MINDESTENS EINEN Weg setzen --------------------------
      # Ohne Webhook/E-Mail landen Alarme (Zahlungsausfall, SMS-Ausfall,
      # verfallene Auftraege) nur im Protokoll - das liest niemand dauerhaft.
      - key: ALARM_WEBHOOK_URL
        sync: false
      - key: ALARM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

      # ---- Zahlungen (Stripe, LIVE-Schluessel) -----------------------------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ---- SMS (Twilio, bezahltes Konto, deutsche Absendernummer) ----------
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false

      # ---- E-Mail (Resend) --------------------------------------------------
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

      # ---- Karten und Routen ------------------------------------------------
      # Google Maps ist die EINZIGE Karte. Zwei Schluessel:
      #   GOOGLE_MAPS_API_KEY              Server (Geocoding API + Routes API)
      #   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY  Browser (Maps JavaScript API), auf die
      #     Domain eingeschraenkt; wird zur BUILD-Zeit eingebacken -> vor dem
      #     Build setzen, jede Aenderung braucht einen neuen Build.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      # Optional: eigene Karten-ID aus der Cloud Console (Styling); sonst DEMO_MAP_ID.
      - key: NEXT_PUBLIC_GOOGLE_MAP_ID
        sync: false

      # ---- Sonstiges --------------------------------------------------------
      - key: AVIATIONSTACK_KEY
        sync: false
      # Web-Push an Fahrer: mit `node scripts/gen-vapid.mjs` erzeugen.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Plattform-Zugang (/super-admin). Wird beim Start per Seed angelegt.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
